project:
  name: qrd2027_adaptive_execution
  version: 0.2.0
  description: Liquidity-adaptive optimal execution simulation for Indian equities
  research_type: simulation_based_execution_research

data:
  source: upstox  # or angelone, csv, synthetic
  frequency: 1min
  timezone: Asia/Kolkata
  market_hours:
    start: "09:15"
    end: "15:30"
  date_start: "2024-01-01"
  date_end: "2024-12-31"
  raw_data_dir: data/raw
  interim_data_dir: data/interim
  processed_data_dir: data/processed

universe:
  stocks:
    - RELIANCE
    - HDFCBANK
    - TCS
    - ICICIBANK
    - INFY
    - SBIN
    - AXISBANK
    - KOTAKBANK
    - LT
    - ITC
  min_history_days: 120
  min_average_daily_volume: 100000

calibration:
  volatility_window: 20
  volume_profile_buckets: 13
  simulation_assumptions:
    spread:
      method: fixed_bps
      value_bps: 5.0
    depth:
      method: volume_multiple
      multiplier: 0.05
    impact_model:
      temporary_impact_exponent: 0.5
      temporary_impact_eta: 0.5
      permanent_impact_fraction: 0.10
  transaction_costs:
    brokerage_bps: 1.50
    exchange_charges_bps: 0.325
    sebi_charges_bps: 0.01
    gst_rate: 0.18
    intraday_stamp_duty_bps: 0.30  # Buy-side intraday statutory stamp duty (0.003%)
    delivery_stamp_duty_bps: 1.50  # Buy-side delivery statutory stamp duty (0.015%)
    intraday_stt_sell_bps: 2.50   # Sell-side intraday STT (0.025%)
    delivery_stt_bps: 10.00       # Delivery STT on buy and sell (0.10%)
    is_intraday: true
  # Backwards compatibility fields
  spread_assumption:
    method: fixed_bps
    value_bps: 5.0
  depth_assumption:
    method: volume_multiple
    multiplier: 0.05
  impact_model:
    temporary_impact_exponent: 0.5
    permanent_impact_fraction: 0.10
  transaction_cost_bps: 2.4653  # Calibrated buy-side intraday total

execution:
  parent_order_sizes_adv:
    - 0.005
    - 0.01
    - 0.02
  execution_horizon_minutes: 375
  max_participation_rate: 0.20
  rebalance_frequency: continuous
  allow_short: false

evaluation:
  confidence_level: 0.95
  benchmarks:
    - twap
    - vwap
    - naive_aggressive
    - percentage_of_volume
    - adaptive
  metrics:
    - arrival_price
    - interval_vwap
    - implementation_shortfall
    - slippage_vs_arrival
    - slippage_vs_interval_vwap
    - temporary_market_impact
    - permanent_market_impact
    - average_spread_paid
    - fill_rate
    - turnover
    - inventory
    - inventory_variance
    - max_inventory
    - execution_completion_rate
    - participation_rate
    - transaction_cost_adjusted_cost
    - performance_by_volatility_regime
    - performance_by_liquidity_regime

simulation:
  random_seed: 42
  number_of_paths: 100
  regime_definitions:
    calm:
      volatility_percentile_max: 40.0
    normal:
      volatility_percentile_min: 40.0
      volatility_percentile_max: 80.0
    stressed:
      volatility_percentile_min: 80.0
